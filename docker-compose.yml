version: '3.8'

services:
  assip-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assip-production-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=assip-enterprise-production-key-2026
      # Optional: AI Provider keys
      # - AI_API_KEY=your_openai_key_here
      # - AI_MODEL=gpt-4o-mini
    restart: unless-stopped
